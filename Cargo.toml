[package]
name = "mp4"
version = "0.14.0"
authors = ["Alf <alf.g.jr@gmail.com>"]
edition = "2021"
# Library MSRV, verified in CI by the `msrv` job. Dev/test tooling (criterion)
# requires a newer toolchain.
rust-version = "1.90"
description = "MP4 reader and writer library in Rust."
documentation = "https://docs.rs/mp4"
readme = "README.md"
homepage = "https://github.com/alfg/mp4-rust"
repository = "https://github.com/alfg/mp4-rust"
keywords = ["mp4", "iso-mp4", "isobmff", "video", "multimedia"]
license = "MIT"
include = ["src", "benches", "Cargo.toml", "README", "LICENSE"]

[dependencies]
thiserror = "^1.0"
base64 = "0.22.1"
byteorder = "1"
bytes = "1.1.0"
hex = "0.4.3"
num-rational = { version = "0.4.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.41"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench_main"
harness = false
